epics:
  - id: DASHBOARD
    title: Dashboard des films
    objective: Mettre en place un tableau de bord pour visualiser les films, leurs genres et leurs pays de production.
    tickets:
      - id: DASHBOARD-01
        key: EXPL-01
        type: feature
        scope: backend
        title: 'Spécifier le modèle de données à utiliser pour le tableau de bord'
        story: |
          En tant qu'analyste, je veux comprendre les informations disponibles dans TMDB et celles nécessaires au tableau de bord, afin de préparer leur collecte et de disposer d'une base de travail pour la modélisation.

          ### Besoin d'exploration

          Le tableau de bord doit permettre de comparer les films selon leur année de sortie sur une période configurable, par exemple 2015 à 2024. On souhaite explorer les titres, les genres, les pays de production, les notes, la popularité, les durées, les budgets et les recettes. Le tableau de bord doit pouvoir agréger et comparer ces informations par année de sortie. Il s'agit uniquement d'un échantillon représentatif des films disponibles dans TMDB. C'est le nombre de films importés qui détermine la représentativité.

          ### Parcours des sources : Discover, puis détail d'un film

          Le point de départ est l'API TMDB Discover (`GET /discover/movie`). Elle permet de rechercher des films selon leur date de sortie et fournit une liste paginée : il faut examiner les différentes pages du résultat.
          Chaque résultat donne notamment l'identifiant du film, ses titres, sa date de sortie, son résumé, ses indicateurs de votes et de popularité, ses chemins d'images et les identifiants de ses genres (`genre_ids`).

          Discover ne fournit pas toutes les informations nécessaires au tableau de bord. Pour chaque film retenu, son identifiant permet ensuite de consulter sa fiche détaillée (`GET /movie/{movie_id}`). Celle-ci apporte
          notamment la durée (`runtime`), le budget (`budget`), les recettes (`revenue`) et les pays de production (`production_countries`). Elle fournit aussi les genres avec leurs identifiants et leurs libellés, de même que les pays de production avec leurs codes et leurs noms.

          Il existe également un catalogue des genres (`GET /genre/movie/list`) qui permet de retrouver l'ensemble des genres disponibles. De la même manière, il existe un catalogue des pays de production (`GET /configuration/countries`) qui permet de retrouver les codes et les noms des pays disponibles.

          ### Comprendre les genres et les pays de production

          Un genre décrit le contenu ou le style d'un film : comédie, aventure, animation, etc. Un même film peut être à la fois une comédie et un film d'aventure. Le libellé « Comédie » peut aussi être partagé par de nombreux
          autres films ; il faut se fier au code TMDB pour reconnaître ce genre, même si son libellé change de langue.

          Le pays de production indique une participation à la production du film. Une coproduction peut faire intervenir plusieurs pays, et un pays peut participer à de nombreux films.

          Par exemple, un film fictif classé « Comédie » et « Aventure », coproduit par la France et la Belgique, doit être retrouvé lorsque l'on explore chacun de ces genres ou chacun de ces pays.

          ### Valeurs absentes, actualisation et calculs

          Les durées, budgets et recettes absents ou égaux à zéro sont considérés comme inconnus ;
          une valeur renseignée doit être strictement positive. Popularité, note et nombre de votes absents restent inconnus, sans remplacement par zéro.

          Retrouver un film déjà collecté doit permettre d'actualiser sa description, ses genres, ses pays et la date de l'observation, sans créer un doublon ni retirer les films des autres années. Ces informations doivent rester cohérentes entre elles.
        size: S
        category: exclu
        priority: P1
        milestone: 2.0.0
        dependsOn: []
        acceptance:
          - Le **M**odèle **C**onceptuel de **D**onnées (**MCD**) est construit et contient les entités et relations nécessaires pour représenter les films, leurs genres et leurs pays de production. L'ensemble des propriétés et contraintes définies dans DASHBOARD-01 est pris en compte.
          - Les cardinalités et relations entre les entités reflètent correctement les règles fonctionnelles et les contraintes d'unicité définies dans DASHBOARD-01.
          - Le schéma relationnel traduit fidèlement le MCD et permet de stocker les films, leurs genres et leurs pays sans doublons.
          - Les contraintes d'intégrité référentielle sont correctement définies pour garantir la cohérence des relations entre les entités.
        definitionOfDone:
          - Le MCD et le schéma relationnel est finalisé et validé.
      - id: DASHBOARD-02
        key: EXPL-02
        type: feature
        scope: backend
        title: Mettre en place le schéma SQLite à partir de la spécification
        story: |
          En tant que développeur, je veux traduire la spécification DASHBOARD-01 en
          schéma SQLite pour stocker les films, leurs genres et leurs pays sans doublons.

          Le schéma s'appuie sur ce qui a été défini dans DASHBOARD-01. Il est initialisé avec `node:sqlite`.

          Un CLI utilisant `commander` permet de créer et d'initialiser la base de données.
          Sans option, il utilise le fichier par défaut :
          ```sh
          node src/back-end/backend-cli.ts
          ```

          L'option `--path` permet de choisir un autre fichier SQLite :

          ```sh
          node src/back-end/backend-cli.ts --path ./data/custom-movies.sqlite
          ```

        size: M
        category: exclu
        priority: P1
        milestone: 2.0.0
        dependsOn: [DASHBOARD-01]
        acceptance:
          - Le schéma SQLite contient les tables et relations définies dans DASHBOARD-01.
          - Les associations sont uniques et les clés étrangères garantissent la cohérence entre les tables liées.
          - L'année de sortie est calculée et stockée à partir de la date de sortie ; les durées, budgets et recettes renseignés doivent être positifs.
          - Le schéma est initialisé avec `node:sqlite` dans une transaction ; une erreur d'initialisation est propagée et annule les changements.
          - Le CLI crée et initialise la base de données par défaut sans option, et accepte `--path` pour sélectionner un autre fichier.
        definitionOfDone:
          - Le schéma SQLite et le CLI d'initialisation sont implémentés en TypeScript avec `node:sqlite` et `commander`.
          - Des tests couvrent la création du schéma, les contraintes d'intégrité et l'annulation en cas d'échec d'initialisation.
          - Des tests vérifient l'initialisation du CLI avec le chemin par défaut et avec un chemin fourni via `--path`.
      - id: DASHBOARD-03
        key: EXPL-GENRES
        type: feature
        scope: backend
        title: Créer et mettre à jour les genres
        story: |
          En tant que gestionnaire de la base de données des films, je veux pouvoir créer et mettre à jour les genres
          afin de maintenir une liste de genres cohérente et à jour.

          Un module dédié **src/back-end/database/genre-repository.ts** expose la recherche par identifiant, la liste des genres et
          l'insertion ou l'actualisation de leurs libellés. Un genre est représenté
          par un identifiant numérique `id` et un nom `name`.
        size: M
        category: socle
        priority: P1
        dependsOn: [DASHBOARD-02]
        acceptance:
          - La recherche par identifiant renvoie le genre correspondant ou `undefined` si aucun genre n'existe.
          - La liste renvoie les genres triés par identifiant croissant.
          - L'insertion ou la mise à jour accepte un itérable de genres ; un identifiant existant entraîne la mise à jour du nom sans créer de doublon.
          - Un itérable vide ne modifie pas les données ; si un identifiant apparaît plusieurs fois, le dernier libellé fourni est conservé.
        definitionOfDone:
          - Le module de gestion des genres est implémenté en TypeScript avec `node:sqlite` et utilise le type `Genre`.
          - Des tests unitaires sur une base SQLite en mémoire couvrent la recherche d'un genre présent ou absent, la liste, l'insertion et la mise à jour sans doublon.
          - Des tests couvrent les tableaux et autres itérables, l'entrée vide, les identifiants répétés et la contrainte de nom obligatoire.
      - id: DASHBOARD-04
        key: EXPL-GENRES-CSV
        type: feature
        scope: backend
        title: Importer les genres depuis un CSV et nettoyer les genres inutilisés
        story: |
          En tant que gestionnaire de la base de données des films, je veux importer
          ou actualiser les genres depuis un fichier CSV et supprimer les genres
          inutilisés afin de maintenir un catalogue cohérent.

          Le CSV contient exactement les colonnes `id` et `name`. La commande
          `add-genres` utilise le module de gestion des genres de DASHBOARD-03 :

          ```sh
          node src/back-end/backend-cli.ts add-genres ./data/genres.csv
          node src/back-end/backend-cli.ts --path ./data/custom-movies.sqlite add-genres ./data/genres.csv
          ```

          La commande `clean-genres` supprime uniquement les genres sans association
          à un film et accepte également le chemin configurable de la base :

          ```sh
          node src/back-end/backend-cli.ts clean-genres
          ```
        size: M
        category: approfondissement
        priority: P2
        dependsOn: [DASHBOARD-03]
        acceptance:
          - Le parseur CSV accepte exactement les en-têtes `id` et `name`, dans n'importe quel ordre et sans distinction de casse.
          - Les fins de ligne LF et CRLF, le BOM UTF-8, les virgules dans les champs entre guillemets et les guillemets échappés sont pris en charge ; les lignes vides sont ignorées.
          - Les identifiants sont des entiers positifs représentables sans perte de précision et les noms sont non vides ; les en-têtes, valeurs et syntaxes CSV invalides provoquent une erreur explicite.
          - La commande `add-genres <csv-file>` insère ou actualise les genres dans la base par défaut ou celle sélectionnée par `--path`, sans créer de doublons.
          - Le CSV est validé avant l'ouverture de la base ; l'import est transactionnel, annulé en cas d'échec et l'erreur est propagée.
          - La commande `clean-genres` supprime uniquement les genres absents de `movie_genres` et conserve les genres associés à un film.
          - Les commandes ferment la connexion SQLite et affichent le nombre de genres importés ou supprimés ainsi que le chemin de la base.
        definitionOfDone:
          - Le parseur CSV est implémenté avec `csv-parse/sync` et les commandes `add-genres` et `clean-genres` sont intégrées au CLI existant.
          - Des tests unitaires couvrent les formats CSV acceptés, les lignes vides, les valeurs invalides et les guillemets mal formés.
          - Des tests du CLI couvrent l'import dans une base sélectionnée, la transaction, le nettoyage limité aux genres inutilisés, la fermeture de la connexion et les messages de résultat.
          - Un fichier d'exemple `data/genres.csv` est fourni et les commandes d'import et de nettoyage sont documentées.
